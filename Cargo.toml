[package]
name = "devtools"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.36", features = ["serialize"] }
sqlformat = "0.3"
sqlparser = "0.52"
base64 = "0.22"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
urlencoding = "2"
resvg = { version = "0.44", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
